[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scitoolkit"
version = "0.6.1"
description = "A community repository for scientific agentic tools - discover, share, and use AI tools for science"
readme = "README.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Alex Roman"}
]
keywords = ["ai", "agents", "science", "tools", "mcp", "orchestral", "astrophysics", "physics", "quantum"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Scientific/Engineering :: Physics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "click>=8.0",
    "requests>=2.31",
    "pyyaml>=6.0",
    # Used by scitoolkit/setup/storage.py to read/write
    # ~/.scitoolkit/config/<toolkit>.yaml while preserving user comments
    # across edits. pyyaml strips comments on dump; ruamel round-trips them.
    "ruamel.yaml>=0.18",
    "rich>=13.0",
    "pydantic>=2.0",
    # Required by Pydantic's EmailStr at runtime; not imported directly.
    "email-validator>=2.0",
    # 1.4 introduced the `state=[...]` decorator argument that the
    # Phase 3C-1 setup system relies on for state-field declaration.
    "orchestral-ai>=1.4",
    "mcp>=1.0",
]

[project.urls]
Homepage = "https://github.com/adroman/scitoolkit"
Documentation = "https://github.com/adroman/scitoolkit#readme"
Repository = "https://github.com/adroman/scitoolkit"
Issues = "https://github.com/adroman/scitoolkit/issues"

[project.scripts]
scitoolkit = "scitoolkit.cli:main"
# `stk` is an alias for `scitoolkit` — same entrypoint, both ship every
# pip install. Use whichever you prefer; `stk list` is identical to
# `scitoolkit list`.
stk = "scitoolkit.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["scitoolkit*"]

[tool.setuptools.package-data]
# Ship template files (non-.py) so `scitoolkit init` works on PyPI installs.
# Without this, only .py files in scitoolkit/templates/ would land in the
# wheel — the .md, .yaml, .txt, and Dockerfile templates would silently
# disappear and `init` would fail with a confusing missing-file error.
"scitoolkit" = [
    "templates/*",
    "templates/**/*",
]